spring:
  mvc:
    async:
      request-timeout: 600000 # 10分钟

  datasource:

    url: jdbc:mysql://localhost:3306/user_id?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456

    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: none # 开发环境可用，生产环境建议 validate 或 none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# 自定义配置：DeepSeek API 相关
deepseek:
  api-key: your_actual_deepseek_api_key_here # 请替换为您的真实 API Key
  base-url: http://10.10.24.103:3001/v1/openai/chat/completions
  model: deepseek-chat # 或您想使用的其他 DeepSeek 模型

server:
  tomcat:
    # 增加 Tomcat 的异步请求超时时间 (单位：毫秒)
    async-timeout: 600000 # 10分钟




